name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The merge queue tests each queued pull request on top of the ones ahead of it; the required checks run here too.
  merge_group:

# Least privilege: the jobs only read the repository; the image jobs also push to GHCR.
permissions:
  contents: read

# A new push to a pull request cancels its older runs. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./src

    # Throwaway server for the database tests in OWSTests/Database. Same major version as .docker/postgres.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWS_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/Directory.*.props', 'src/**/Directory.*.targets') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore OWS.sln

    - name: Build
      run: dotnet build OWS.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test OWS.sln --configuration Release --no-build --verbosity normal

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./src

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/Directory.*.props', 'src/**/Directory.*.targets') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore OWS.sln

    # Fails on High or Critical advisories (direct or transitive); Moderate and Low are warnings.
    - name: Check for vulnerable packages
      run: bash ../.github/scripts/check-vulnerable-packages.sh OWS.sln "$RUNNER_TEMP/vulnerable-packages.json"

  # The app images Deploy (deploy.yml) ships, built only for main once the checks pass. The compose file names
  # them <registry>/<service>:<platform>-<tag>, so they are pushed as ghcr.io/<repo>/<service>:linux-<full SHA>.
  images:
    name: Image (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ build, vulnerable-packages ]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
        - { service: owspublicapi, dockerfile: OWSPublicAPI/Dockerfile }
        - { service: owscharacterpersistence, dockerfile: OWSCharacterPersistence/Dockerfile }
        - { service: owsinstancemanagement, dockerfile: OWSInstanceManagement/Dockerfile }
        - { service: owsglobaldata, dockerfile: OWSGlobalData/Dockerfile }
        - { service: owschat, dockerfile: OWSChat/Dockerfile }
        - { service: owsparty, dockerfile: OWSParty/Dockerfile }

    steps:
    - uses: actions/checkout@v7

    - name: Image name
      id: image
      run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}:linux-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4

    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ./src
        file: ./src/${{ matrix.dockerfile }}
        push: true
        tags: ${{ steps.image.outputs.ref }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}
